{% extends "base.html" %}

{% block title %}About Us - UB GROUP{% endblock %}

{% block content %}
    <section class="py-5">
        <div class="container">
            <h1 class="text-center mb-4">About UB GROUP</h1>
            <div class="row">
                <div class="col-md-6">
                    <img src="{{ url_for('static', filename='img/ubgrouplogo.jpeg') }}" alt="UB Group Logo" class="img-fluid mb-3">
                </div>
                <div class="col-md-6">
                    <h2>{{ group_info.tagline }}</h2>
                    <p>{{ group_info.overview }}</p>
                </div>
            </div>
            <div class="mt-5">
                <h2>Our Story</h2>
                <p>{{ group_info.about_us }}</p>
            </div>
        </div>
    </section>
{% endblock %}
